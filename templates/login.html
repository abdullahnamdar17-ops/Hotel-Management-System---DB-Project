{% extends 'base.html' %}{% from 'macros.html' import token with context %}
{% block content %}<section class="panel login-card"><span class="brand-icon">H</span><h2>Welcome back.</h2><p>Sign in to manage your properties and guest operations.</p>
{% if login_error %}<div class="notice error" role="alert">The password is incorrect. Please try again.</div>{% endif %}
<form method="post">{{ token() }}<div class="field"><label for="password">Staff password</label><input id="password" name="password" type="password" required autocomplete="current-password" autofocus></div><button>Sign in →</button></form></section>{% endblock %}
